<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCareLink - Truy cập hạn chế</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 360px;
        }
        h1 { font-size: 18px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 10px 12px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>EduCareLink</h1>
        <p>Vui lòng nhập mật khẩu truy cập để tiếp tục.</p>
        {% if error %}
            <div class="error">Sai mật khẩu, vui lòng thử lại.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="password" name="password" placeholder="Mật khẩu truy cập" autofocus required>
            <button type="submit">Vào trang</button>
        </form>
    </div>
</body>
</html>
