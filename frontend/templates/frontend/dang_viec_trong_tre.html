{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EduCareLink — Đăng việc Trông trẻ</title>
    <link rel="stylesheet" href="{% static 'css/tailwind-default.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
    </style>
    {% include 'frontend/_matching_common.html' %}
</head>
<body class="bg-gray-50">
<header class="bg-white border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="{% url 'frontend:dang_viec_select' %}" class="text-sm font-semibold text-gray-500">← Chọn lại</a>
        <span class="font-headline font-extrabold text-[#1A1A2E]">Đăng việc — Trông trẻ</span>
        <span class="w-16"></span>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-8">
    <form id="jobForm" class="space-y-4">
        <div class="mcm-card">
            <h2 class="font-bold text-[#1A1A2E] mb-2">1. Thông tin bé</h2>
            <label class="mcm-label" for="ageGroup">Độ tuổi của bé (bắt buộc)</label>
            <select id="ageGroup" class="mcm-input">
                <option value="">— Chọn độ tuổi —</option>
                <option value="under_3">Dưới 3 tuổi</option>
                <option value="preschool">Mầm non (3-6 tuổi)</option>
                <option value="primary">Tiểu học (6-11 tuổi)</option>
                <option value="secondary">THCS (11-15 tuổi)</option>
                <option value="mixed">Nhiều độ tuổi</option>
            </select>
            <label class="mcm-label" for="nChildren">Số lượng trẻ (bắt buộc, ≥ 1)</label>
            <input id="nChildren" type="number" min="1" max="10" class="mcm-input" placeholder="1">
            <label class="mcm-label">Việc cần chăm sóc (bắt buộc — chọn nhiều)</label>
            <div class="grid grid-cols-2 gap-2 text-sm">
                <label class="flex items-center gap-2"><input type="checkbox" class="duty" value="feed"> Cho ăn / bữa ăn</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="duty" value="bath"> Tắm rửa / vệ sinh</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="duty" value="study"> Hướng dẫn bài tập</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="duty" value="play"> Chơi cùng bé</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="duty" value="sleep"> Đưa bé ngủ</label>
                <label class="flex items-center gap-2"><input type="checkbox" class="duty" value="transport"> Đưa đón</label>
            </div>
            <label class="mcm-label" for="medical">Dị ứng / bệnh lý cần lưu ý (tuỳ chọn)</label>
            <input id="medical" class="mcm-input" placeholder="VD: dị ứng tôm cua, hen suyễn nhẹ…">
        </div>

        <div class="mcm-card">
            <h2 class="font-bold text-[#1A1A2E] mb-2">2. Yêu cầu &amp; thời gian</h2>
            <label class="mcm-label" for="specific_requirements">Yêu cầu cụ thể (bắt buộc)</label>
            <textarea id="specific_requirements" class="mcm-input" rows="3"
                      placeholder="VD: Cần người vào buổi tối trông 2 bé ăn tối + làm bài tập…"></textarea>
            <label class="mcm-label">Các ngày cần trông trẻ (bắt buộc)</label>
            <input id="dates" class="mcm-input" placeholder="Chọn ngày (có thể nhiều ngày)">
            <div id="dateList" class="flex flex-wrap gap-2 mt-2"></div>
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div>
                    <label class="mcm-label" for="timeFrom">Từ</label>
                    <input id="timeFrom" class="mcm-input" placeholder="18:00" readonly>
                </div>
                <div>
                    <label class="mcm-label" for="timeTo">Đến</label>
                    <input id="timeTo" class="mcm-input" placeholder="21:00" readonly>
                </div>
            </div>
        </div>

        <div class="mcm-card">
            <h2 class="font-bold text-[#1A1A2E] mb-2">3. Địa điểm &amp; giá</h2>
            <label class="mcm-label" for="rate">Giá/giờ (VND, bắt buộc &gt; 0)</label>
            <input id="rate" type="number" min="1000" step="1000" class="mcm-input" placeholder="120000">
            <label class="mcm-label">Chọn vị trí nhà trên bản đồ (bắt buộc)</label>
            <div class="mcm-map-search">
                <input id="mapSearch" placeholder="Nhập địa chỉ để tìm…">
                <button type="button" id="mapGps" class="mcm-btn-ghost">Dùng vị trí hiện tại</button>
            </div>
            <div id="map" class="mcm-map"></div>
            <div id="mapAddr" class="mcm-addr">Chưa chọn vị trí</div>
            <input type="hidden" id="lat"><input type="hidden" id="lng">
            <label class="mcm-label" for="locationNote">Ghi chú vị trí (cổng, tầng… — tuỳ chọn)</label>
            <input id="locationNote" class="mcm-input" placeholder="VD: Ngõ 15 Phạm Văn Đồng, nhà màu cam">
        </div>

        <button type="submit" id="submitBtn" class="mcm-submit">Đăng việc &amp; tìm ứng viên</button>
    </form>
</main>

<script>
  const dates = new Set();
  initDatePicker('#dates').config.onChange.push((d, s) => {
    if (s && !dates.has(s)) {
      dates.add(s);
      const chip = document.createElement('span');
      chip.className = 'px-3 py-1 rounded-full bg-[rgba(242,101,34,0.12)] text-[#F26522] text-xs font-semibold cursor-pointer';
      chip.textContent = s + ' ✕';
      chip.onclick = () => { dates.delete(s); chip.remove(); };
      document.getElementById('dateList').appendChild(chip);
      document.getElementById('dates').value = '';
    }
  });
  initTimePicker(null, '#timeFrom', '#timeTo');
  initMapPicker({ mapId: 'map', searchId: 'mapSearch', btnGpsId: 'mapGps', addrId: 'mapAddr',
                  latInput: 'lat', lngInput: 'lng' });

  document.getElementById('jobForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const duties = [...document.querySelectorAll('.duty:checked')].map((el) => el.value);
    const ageGroup = document.getElementById('ageGroup').value;
    const nChildren = Number(document.getElementById('nChildren').value);
    const req = document.getElementById('specific_requirements').value.trim();
    const rate = Number(document.getElementById('rate').value);
    const lat = document.getElementById('lat').value, lng = document.getElementById('lng').value;
    const timeFrom = document.getElementById('timeFrom').value, timeTo = document.getElementById('timeTo').value;

    if (!ageGroup) return toast('Chọn độ tuổi của bé.', false);
    if (!nChildren || nChildren < 1) return toast('Số lượng trẻ phải ≥ 1.', false);
    if (duties.length === 0) return toast('Chọn ít nhất 1 việc cần chăm sóc.', false);
    if (!req || req.length < 10) return toast('Mô tả yêu cầu cụ thể ít nhất 10 ký tự.', false);
    if (dates.size === 0) return toast('Chọn ít nhất 1 ngày.', false);
    if (!timeFrom || !timeTo || timeTo <= timeFrom) return toast('Giờ kết thúc phải sau giờ bắt đầu.', false);
    if (!rate || rate <= 0) return toast('Nhập giá/giờ hợp lệ.', false);
    if (!lat || !lng) return toast('Chọn vị trí trên bản đồ.', false);

    btn.disabled = true;
    try {
      const resp = await authFetch(API_BASE + '/matching/jobs/', {
        method: 'POST', body: JSON.stringify({
          job_type: 'childcare',
          child_age_group: ageGroup,
          number_of_children: nChildren,
          care_duties: duties,
          medical_allergy_notes: document.getElementById('medical').value.trim(),
          specific_requirements: req,
          dates: [...dates].sort(),
          time_from: timeFrom, time_to: timeTo,
          hourly_rate_vnd: rate,
          latitude: Number(lat), longitude: Number(lng),
          location_note: document.getElementById('locationNote').value.trim(),
        })});
      const data = await resp.json();
      if (resp.status === 201) {
        toast('Đăng thành công! Đang tạo ứng viên…');
        const pub = await authFetch(`${API_BASE}/matching/jobs/${data.id}/publish/`, { method: 'POST' });
        if (pub.ok) {
          toast('Đã mở tìm ứng viên. Chuyển tới danh sách…');
          setTimeout(() => location.href = `/ung-vien/${data.id}/`, 900);
        } else { toast('Đăng được nhưng chưa publish được — xem đơn của bạn.', false); }
      } else {
        const detail = data.detail || data;
        toast(typeof detail === 'string' ? detail : 'Vui lòng kiểm tra lại thông tin.', false);
        console.warn(detail);
      }
    } catch (err) { console.warn(err); toast('Không gửi được. Vui lòng kiểm tra kết nối và thử lại.', false); }
    finally { btn.disabled = false; }
  });
</script>
</body>
</html>
