{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <title>EduCareLink - Đang hoàn tất đăng nhập Google...</title>
    <link rel="stylesheet" href="{% static 'css/tailwind-default.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .spinner {
            width: 44px; height: 44px;
            border: 4px solid #fed7aa;
            border-top-color: #ea580c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center px-4">
    <div class="text-center max-w-md w-full">
        <img src="/static/images/logo.png" alt="Logo EduCareLink"
             style="width:72px;height:72px;object-fit:contain;margin:0 auto 16px;">
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">EduCareLink</h1>

        <!-- Trạng thái đang xử lý -->
        <div id="state-loading">
            <div class="spinner"></div>
            <p class="mt-4 text-gray-600 font-medium">Đang hoàn tất đăng nhập bằng Google...</p>
            <p class="mt-1 text-sm text-gray-400">Vui lòng không tắt trang này.</p>
        </div>

        <!-- Trạng thái lỗi -->
        <div id="state-error" class="hidden">
            <div class="bg-red-50 border border-red-200 rounded-xl p-5 text-left">
                <p class="font-bold text-red-700 mb-1">Đăng nhập Google không thành công</p>
                <p id="error-message" class="text-sm text-red-600"></p>
            </div>
            <a href="{% url 'frontend:login' %}"
               class="inline-block mt-4 px-6 py-3 rounded-xl bg-orange-600 text-white font-bold hover:bg-orange-700 transition-colors">
                Về trang đăng nhập
            </a>
        </div>
    </div>

    <script>
        // =====================================================================
        // Hoàn tất đăng nhập Google (web):
        // 1. Gọi /api/auth/google/complete/ — backend đọc one-time uid trong
        //    session (đặt bởi /accounts/google/login/callback/) và trả JWT.
        // 2. Lưu localStorage ĐÚNG pattern login.html (token/refresh_token/role)
        // 3. Điều hướng theo role — GIỐNG HỆT logic login.html
        // =====================================================================
        (function () {
            var loadingEl = document.getElementById('state-loading');
            var errorEl = document.getElementById('state-error');
            var errorMsg = document.getElementById('error-message');

            function showError(message) {
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                errorMsg.textContent = message;
            }

            fetch('/api/auth/google/complete/', {
                method: 'GET',
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
            })
                .then(function (response) {
                    return response.json().then(function (data) {
                        return { ok: response.ok, data: data };
                    });
                })
                .then(function (result) {
                    if (!result.ok) {
                        showError(result.data.error || 'Phiên đăng nhập đã hết hạn. Vui lòng thử lại.');
                        return;
                    }
                    var data = result.data;

                    // Lưu JWT + role — trùng khớp keys login.html
                    localStorage.setItem('token', data.tokens.access);
                    localStorage.setItem('refresh_token', data.tokens.refresh);
                    localStorage.setItem('role', data.role);
                    if (data.is_staff) localStorage.setItem('is_staff', 'true');
                    if (data.username) localStorage.setItem('admin_username', data.username);

                    loadingEl.querySelector('p.font-medium').textContent = 'Đăng nhập thành công! Đang chuyển hướng...';

                    // Điều hướng — trùng khớp logic login.html
                    setTimeout(function () {
                        if (data.is_staff) {
                            window.location.href = "{% url 'frontend:admin_dashboard' %}";
                        } else if (data.first_login) {
                            window.location.href = data.role === 'parent'
                                ? "{% url 'frontend:parent_onboarding' %}"
                                : "{% url 'frontend:worker_onboarding' %}";
                        } else {
                            window.location.href = data.role === 'parent'
                                ? "{% url 'frontend:parent_home' %}"
                                : "{% url 'frontend:worker_feed' %}";
                        }
                    }, 800);
                })
                .catch(function () {
                    showError('Không thể kết nối máy chủ. Vui lòng kiểm tra mạng và thử lại.');
                });
        })();
    </script>
</body>
</html>
