{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/favicon-32.png">
    <title>EduCareLink — Đơn ghép cặp của tôi</title>
    <link rel="stylesheet" href="{% static 'css/tailwind-default.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
        .booking-card {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .booking-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(26, 26, 46, 0.08);
            border-color: rgba(242, 101, 34, 0.35);
        }
    </style>
    {% include 'frontend/_matching_common.html' %}
</head>
<body class="bg-[#F8F9FB] min-h-screen text-[#1A1A2E]">
<header class="bg-white border-b border-gray-100 sticky top-0 z-40 backdrop-blur-md bg-white/90">
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
        <a href="/worker/" class="flex items-center gap-1.5 text-sm font-bold text-gray-600 hover:text-[#F26522] transition">
            <span class="material-symbols-outlined text-lg">arrow_back</span>
            <span>Tìm việc</span>
        </a>
        <span class="font-headline font-extrabold text-[#1A1A2E] text-base">Đơn ghép cặp của tôi</span>
        <span class="text-xs font-bold text-[#F26522] bg-orange-50 px-2.5 py-1 rounded-full border border-orange-200">
            Flow 1
        </span>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-8 mcm-fade-in">
    <!-- Tab lọc -->
    <div class="flex gap-2 overflow-x-auto pb-3 mb-2 scrollbar-none" id="tabs"></div>
    <div id="loading" class="text-center py-20 text-gray-400">
        <div class="w-12 h-12 border-3 border-gray-200 border-t-[#F26522] rounded-full animate-spin mx-auto mb-3"></div>
        <p class="font-medium text-sm">Đang tải danh sách đơn...</p>
    </div>
    <div id="list" class="space-y-3.5"></div>
</main>

<script>
  const FILTERS = [
    { key: '', label: 'Tất cả' },
    { key: 'awaiting_commitment', label: 'Chờ cam kết' },
    { key: 'committed', label: 'Đã cam kết' },
    { key: 'in_progress', label: 'Đang làm' },
    { key: 'completed', label: 'Hoàn thành' },
    { key: 'cancelled_by_carepartner', label: 'Đã hủy' },
  ];
  const STATUS_COLORS = {
    awaiting_commitment: '#F26522', committed: '#0E9F6E', in_progress: '#2563EB',
    completed: '#0E9F6E', cancelled_by_carepartner: '#DC2626', cancelled_by_parent: '#DC2626',
    no_show: '#DC2626', suspected_no_show: '#F5A623', seeking_replacement: '#F5A623',
  };
  const APPEALABLE = ['cancelled_by_carepartner', 'no_show', 'no_show_unconfirmed', 'suspected_no_show'];
  let current = '';

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    FILTERS.forEach((f) => {
      const b = document.createElement('button');
      b.className = 'whitespace-nowrap px-4 py-2 rounded-full text-xs font-extrabold border transition shadow-sm ' +
        (current === f.key ? 'bg-[#F26522] text-white border-[#F26522]' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50');
      b.textContent = f.label;
      b.onclick = () => { current = f.key; renderTabs(); load(); };
      tabs.appendChild(b);
    });
  }

  async function load() {
    try {
      const resp = await authFetch(API_BASE + '/matching/bookings/' + (current ? `?status=${current}` : ''));
      if (!resp.ok) { toast('Không tải được danh sách đơn. Vui lòng thử lại.', false); return; }
      const data = await resp.json();
      document.getElementById('loading').classList.add('hidden');
      const list = document.getElementById('list');
      list.innerHTML = '';
      const rows = data.results || [];
      if (!rows.length) {
        list.innerHTML = `
          <div class="bg-white rounded-2xl p-10 text-center border border-gray-200">
            <div class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">📋</div>
            <h3 class="font-headline font-bold text-base text-[#1A1A2E]">Chưa có đơn nào ở mục này</h3>
            <p class="text-xs text-gray-500 mt-1">Khi bạn được phụ huynh chọn, các đơn ghép cặp sẽ hiển thị tại đây.</p>
          </div>`;
        return;
      }
      for (const b of rows) {
        const color = STATUS_COLORS[b.status] || '#6B7280';
        const s = b.first_slot || {};
        const card = document.createElement('a');
        card.href = `/don/${b.id}/`;
        card.className = 'booking-card block bg-white rounded-2xl p-5 shadow-sm border border-gray-200/80 group';
        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div class="font-headline font-extrabold text-[#1A1A2E] text-base truncate group-hover:text-[#F26522] transition">${b.job_title || 'Công việc ghép cặp'}</div>
            <span class="text-xs font-extrabold px-3 py-1 rounded-full text-white shrink-0 shadow-sm" style="background:${color}">${b.status_label_vi || b.status}</span>
          </div>
          <div class="text-xs sm:text-sm text-gray-500 mt-2 flex items-center gap-2">
            <span>📅</span>
            <span>${s.date || '—'} · ${s.time_from ? s.time_from.slice(0, 5) : ''}–${s.time_to ? s.time_to.slice(0, 5) : ''}</span>
          </div>
          <div class="text-xs sm:text-sm font-bold text-[#1A1A2E] mt-1.5 flex items-center gap-2">
            <span>💰</span>
            <span>${fmtVND(b.total_value_vnd)}</span>
            ${b.compensation_vnd > 0 ? `<span class="text-[#F5A623] font-semibold text-xs">· Đền bù ${fmtVND(b.compensation_vnd)}</span>` : ''}
          </div>
          ${APPEALABLE.includes(b.status)
            ? `<div class="mt-3.5 pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
                 <span class="inline-block text-xs px-3 py-1 rounded-full bg-amber-100 text-amber-800 font-bold">⚖️ Có thể kháng cáo ELO</span>
                 <span class="text-xs text-[#F26522] font-extrabold hover:underline" onclick="event.preventDefault(); window.location.href='/khang-cao/${b.id}/';">Kháng cáo ngay →</span>
               </div>`
            : ''}`;
        list.appendChild(card);
      }
    } catch (err) {
      console.warn(err);
      document.getElementById('loading').classList.add('hidden');
      toast('Không tải được danh sách đơn. Vui lòng thử lại.', false);
    }
  }

  renderTabs();
  load();
</script>
</body>
</html>
