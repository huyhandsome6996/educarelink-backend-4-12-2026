services:
  - type: web
    name: educarelink-backend
    plan: free
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      # Keep-Alive Scheduler (tự ping mỗi 3 phút để Render free không sleep)
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: "3"
      - key: RENDER_URL
        value: "https://educarelink-backend.onrender.com"
      # AI Anomaly Detection (tự quét bất thường mỗi 10 phút → thông báo Admin)
      - key: ANOMALY_ENABLED
        value: "true"
      - key: ANOMALY_CHECK_INTERVAL
        value: "10"
      # Social OAuth (Google + Facebook đăng nhập cho Phụ huynh)
      # Đặt giá trị thực trên Render Dashboard → Settings → Environment Variables
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      # DATABASE_URL: Bắt buộc đặt thủ công trên Render Dashboard
      # Vào Settings → Environment → Add Environment Variable
      # Key: DATABASE_URL
      # Value: connection string từ Neon (postgresql://user:pass@ep-xxx.neon.tech/db?sslmode=require)
      # ── MoMo Payment (escrow + cash settlement) ──
      # Đăng ký đối tác tại https://business.momo.vn/ để lấy Partner Code / Access Key / Secret Key
      # Sandbox test credentials có sẵn trong docs https://developers.momo.vn/v3/vi/docs/payment/app/app-in-app/payment-link
      - key: MOMO_ENVIRONMENT
        value: "sandbox"     # chuyển sang "production" khi go-live
      - key: MOMO_PARTNER_CODE
        sync: false
      - key: MOMO_ACCESS_KEY
        sync: false
      - key: MOMO_SECRET_KEY
        sync: false
      - key: MOMO_STORE_ID
        value: "EduCareLinkStore"
      - key: MOMO_RETURN_BASE_URL
        value: "https://educarelink-backend.onrender.com"
      - key: MOMO_IPN_URL
        value: "https://educarelink-backend.onrender.com/api/payments/momo-ipn/"
      - key: PAYMENT_COMMISSION_RATE
        value: "0.20"
      - key: PAYMENT_SETTLEMENT_DUE_DAYS
        value: "7"
      - key: PAYMENT_SCHEDULER_ENABLED
        value: "true"
      # ── Device Offline Alert (chống tắt máy/đập máy) ──
      # Carepartner app gửi heartbeat mỗi 30s
      # Backend scheduler quét mỗi 1 phút — nếu last_seen > 60s → push chuông cho phụ huynh
      - key: TRACKING_HEARTBEAT_INTERVAL
        value: "30"
      # QA-FIX-2 / C: TRACKING_OFFLINE_THRESHOLD là nguồn cấu hình DUY NHẤT.
      # Không hardcode 60s hay 90s trong code/UI. API trả về giá trị này.
      - key: TRACKING_OFFLINE_THRESHOLD
        value: "60"
      - key: TRACKING_OFFLINE_CHECK_ENABLED
        value: "true"
      - key: TRACKING_OFFLINE_CHECK_INTERVAL
        value: "1"
      # QA-FIX-2 / C: schedulers KHÔNG chạy trong web worker mặc định
      # (tránh duplicate alerts khi WEB_CONCURRENCY=2). Chạy schedulers qua
      # background worker riêng hoặc Render cron job:
      #   python manage.py run_tracking_schedulers --once
      # Set TRACKING_SCHEDULER_IN_WEB_WORKER=true để override (debug only).
      - key: TRACKING_SCHEDULER_IN_WEB_WORKER
        value: "false"
      # ── Random Verification Check (xác minh ngẫu nhiên PIN) ──
      # Carepartner phải nhập PIN 4-6 số khi hệ thống yêu cầu bất ngờ
      - key: VERIFICATION_CHECK_ENABLED
        value: "true"
      - key: VERIFICATION_TARGET_CHECKS_PER_SHIFT
        value: "2"
      - key: VERIFICATION_ESTIMATED_SHIFT_MINUTES
        value: "180"
      - key: VERIFICATION_MIN_MINUTES_BETWEEN_CHECKS
        value: "15"
      - key: VERIFICATION_RESPOND_TIMEOUT_SECONDS
        value: "90"
      - key: VERIFICATION_CONSECUTIVE_TIMEOUTS_BEFORE_PARENT_ALERT
        value: "2"
      - key: VERIFICATION_MAX_WRONG_ATTEMPTS
        value: "3"
      - key: VERIFICATION_CHECK_INTERVAL_MINUTES
        value: "1"
      # QA-FIX-3 / B: health logging — scheduler process log mỗi N lần chạy
      # (mặc định 5 → log heartbeat mỗi 5 phút nếu cron mỗi 1 phút).
      - key: TRACKING_SCHEDULER_HEALTH_LOG_EVERY
        value: "5"

  # ═══════════════════════════════════════════════════════════════════
  # QA-FIX-3 / C — SCHEDULER PRODUCTION DEPLOYMENT
  # ═══════════════════════════════════════════════════════════════════
  # Vấn đề: QA-FIX-2 set TRACKING_SCHEDULER_IN_WEB_WORKER=false để tránh
  # 2 gunicorn worker cùng chạy scheduler → scheduler KHÔNG chạy ai cả.
  # → DeviceOfflineAlert + RandomVerificationCheck không bao giờ được tạo.
  #
  # Giải pháp: bổ sung 1 Render Cron Job chạy mỗi 1 phút:
  #   python manage.py run_tracking_schedulers --once
  # Cron job chạy độc lập với web service, không phụ thuộc WEB_CONCURRENCY.
  # DB unique constraint (unique_active_alert_per_task,
  # unique_pending_check_per_task_worker) đảm bảo即使 2 cron run overlap
  # cũng không tạo duplicate.
  #
  # Lưu ý:
  #   - Render free plan: cron job miễn phí nhưng giới hạn 1 phút minimum.
  #   - Nếu cron job fail → Render log, không retry. Code wrap try/except
  #     và log error để debug.
  #   - Alternative: dùng background worker dyno chạy daemon
  #     (`python manage.py run_tracking_schedulers` không --once) — tốn
  #     tiền nhưng reliable hơn (auto-restart on crash).
  # ═══════════════════════════════════════════════════════════════════
  - type: cron
    name: educarelink-tracking-scheduler
    env: python
    schedule: "* * * * *"   # mỗi 1 phút
    buildCommand: "./build.sh"
    startCommand: "python manage.py run_tracking_schedulers --once --only both"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: RENDER
        value: "true"
      - key: DEBUG
        value: "False"
      - key: TRACKING_SCHEDULER_PROCESS
        value: "true"
      - key: TRACKING_SCHEDULER_IN_WEB_WORKER
        value: "false"
      - key: TRACKING_OFFLINE_CHECK_ENABLED
        value: "true"
      - key: TRACKING_OFFLINE_THRESHOLD
        value: "60"
      - key: TRACKING_HEARTBEAT_INTERVAL
        value: "30"
      - key: VERIFICATION_CHECK_ENABLED
        value: "true"
      - key: VERIFICATION_TARGET_CHECKS_PER_SHIFT
        value: "2"
      - key: VERIFICATION_ESTIMATED_SHIFT_MINUTES
        value: "180"
      - key: VERIFICATION_MIN_MINUTES_BETWEEN_CHECKS
        value: "15"
      - key: VERIFICATION_RESPOND_TIMEOUT_SECONDS
        value: "90"
      - key: VERIFICATION_CONSECUTIVE_TIMEOUTS_BEFORE_PARENT_ALERT
        value: "2"
      - key: VERIFICATION_MAX_WRONG_ATTEMPTS
        value: "3"
      - key: VERIFICATION_CHECK_INTERVAL_MINUTES
        value: "1"
      - key: TRACKING_SCHEDULER_HEALTH_LOG_EVERY
        value: "5"
      # DATABASE_URL + SECRET_KEY + GEMINI_API_KEY + EXPO_ACCESS_TOKEN:
      # sync từ web service (Render Dashboard → Environment → "Copy from
      # existing service" → chọn educarelink-backend).

