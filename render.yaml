services:
  - type: web
    name: educarelink-backend
    plan: free
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT backend.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DEBUG
        value: "False"
      - key: RENDER
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: "3"
      - key: RENDER_URL
        value: "https://educarelink-backend.onrender.com"
      - key: ANOMALY_ENABLED
        value: "true"
      - key: ANOMALY_CHECK_INTERVAL
        value: "10"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: MOMO_ENVIRONMENT
        value: "sandbox"
      - key: MOMO_PARTNER_CODE
        sync: false
      - key: MOMO_ACCESS_KEY
        sync: false
      - key: MOMO_SECRET_KEY
        sync: false
      - key: MOMO_STORE_ID
        value: "EduCareLinkStore"
      - key: MOMO_RETURN_BASE_URL
        value: "https://educarelink-backend.onrender.com"
      - key: MOMO_IPN_URL
        value: "https://educarelink-backend.onrender.com/api/payments/momo-ipn/"
      - key: PAYMENT_COMMISSION_RATE
        value: "0.20"
      - key: PAYMENT_SETTLEMENT_DUE_DAYS
        value: "7"
      - key: PAYMENT_SCHEDULER_ENABLED
        value: "true"
      - key: TRACKING_HEARTBEAT_INTERVAL
        value: "30"
      - key: TRACKING_OFFLINE_THRESHOLD
        value: "60"
      - key: TRACKING_OFFLINE_CHECK_ENABLED
        value: "true"
      - key: TRACKING_OFFLINE_CHECK_INTERVAL
        value: "1"
      # Optional: Redis URL for multi-process WebSocket fan-out
      # - key: REDIS_URL
      #   sync: false
