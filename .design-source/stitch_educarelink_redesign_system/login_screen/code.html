<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduCareLink - Đăng nhập</title>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Login Container -->
<main class="w-full max-w-md">
<!-- Header Section -->
<header class="text-center mb-xl">
<h1 class="font-h1 text-h1 text-primary-container mb-sm">Chào mừng trở lại</h1>
<p class="font-body text-body text-on-surface-variant">Đăng nhập để tiếp tục kết nối</p>
</header>
<!-- Card Base -->
<div class="bg-surface-container-lowest rounded-[20px] shadow-sm p-lg w-full mb-lg border border-surface-variant">
<form action="#" class="space-y-lg" method="POST">
<!-- Phone Number Field -->
<div>
<label class="block font-caption text-caption text-on-surface-variant mb-xs" for="phone">Số điện thoại</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm">
<span class="material-symbols-outlined text-outline-variant" data-icon="phone_iphone">phone_iphone</span>
</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-[#F0F0F0] rounded-[14px] font-body text-body text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="phone" name="phone" placeholder="Nhập số điện thoại của bạn" required="" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-caption text-caption text-on-surface-variant" for="password">Mật khẩu</label>
<a class="font-caption text-caption text-primary-container hover:underline" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</span>
<input class="w-full pl-xl pr-xl py-sm bg-surface-container-lowest border border-[#F0F0F0] rounded-[14px] font-body text-body text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-sm text-outline-variant hover:text-on-surface-variant focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-h4 text-h4 py-sm rounded-lg shadow-[0_10px_20px_-10px_rgba(242,101,34,0.6)] hover:bg-[#D4541E] active:scale-95 transition-all duration-200 min-h-[44px] flex items-center justify-center gap-xs" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Social Login Divider -->
<div class="flex items-center mb-lg">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="px-sm font-caption text-caption text-on-surface-variant bg-surface">Hoặc tiếp tục với</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-md mb-xl">
<button class="bg-surface-container-lowest border border-surface-variant rounded-[14px] py-sm font-body text-body text-on-surface flex items-center justify-center gap-xs hover:bg-surface-container-low transition-colors min-h-[44px]">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                Google
            </button>
<button class="bg-surface-container-lowest border border-surface-variant rounded-[14px] py-sm font-body text-body text-on-surface flex items-center justify-center gap-xs hover:bg-surface-container-low transition-colors min-h-[44px]">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.675 0H1.325C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.593 1.323-1.325V1.325C24 .593 23.407 0 22.675 0z" fill="#1877F2"></path></svg>
                Facebook
            </button>
</div>
<!-- Signup Link -->
<div class="text-center">
<span class="font-body text-body text-on-surface-variant">Chưa có tài khoản?</span>
<a class="font-h4 text-h4 text-primary-container hover:underline ml-xs" href="#">Đăng ký ngay</a>
</div>
</main>
</body></html>
