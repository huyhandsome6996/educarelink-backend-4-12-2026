<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom animation for splash screen loading */
        @keyframes subtlePulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.7; transform: scale(0.98); }
        }
        
        @keyframes floatUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .animate-float-up {
            animation: floatUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        .bg-primary-gradient {
            background: linear-gradient(135deg, #f26522 0%, #d4541e 100%);
        }
        
        /* Custom loader */
        .loader-bar {
            width: 100%;
            height: 4px;
            background-color: rgba(255, 207, 179, 0.3); /* #FFCFB3 with opacity */
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }
        
        .loader-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background-color: #ffffff;
            border-radius: 999px;
            animation: progressSweep 2s ease-in-out infinite;
        }
        
        @keyframes progressSweep {
            0% { left: -30%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body class="bg-primary-container h-screen w-full flex flex-col justify-between items-center overflow-hidden relative">
<!-- Subtle Background Pattern (Abstract Warm Shapes) -->
<div class="absolute inset-0 w-full h-full opacity-10 pointer-events-none z-0">
<svg height="100%" preserveaspectratio="none" viewbox="0 0 100 100" width="100%">
<circle cx="20" cy="20" fill="#ffffff" r="40"></circle>
<circle cx="80" cy="80" fill="#ffffff" r="50"></circle>
<path d="M-20,100 Q40,50 120,80 L120,120 L-20,120 Z" fill="#ffffff"></path>
</svg>
</div>
<!-- Top spacer for vertical centering -->
<div class="flex-1"></div>
<!-- Main Content Area -->
<main class="flex flex-col items-center justify-center z-10 w-full px-margin-mobile">
<!-- Logo / Illustration Container -->
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center mb-lg animate-float-up shadow-xl" style="animation-name: subtlePulse; animation-duration: 4s; animation-iteration-count: infinite; animation-timing-function: ease-in-out;">
<!-- Illustration Placeholder -->
<div class="w-24 h-24 md:w-32 md:h-32 rounded-full overflow-hidden border-4 border-white shadow-inner bg-white flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A minimal, warm-toned vector illustration of an adult hand gently holding a child's hand. The style is modern corporate minimalism, utilizing a high-key light mode aesthetic. The background is a crisp white. The adult hand is rendered in a soft, grounding green while the child's hand uses a vibrant, reassuring orange. The artwork communicates supervised freedom, safety, and professional caregiving." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDoywOIelWIOLKjs3G-p4rE-CHkBEGVGL9hSTxmQnD56nFuv-TJ454E1-TLJ5gsrTrEg3a-DRlm2S0A1rop4hDtPIQoqchlO4k0vCCtsmYz5jSEGExMTfyB3KwGtidkyfbJKLWoBUgQrqS-o1uTzs6wCS9GzsksS4AnPbeoaaUs59b8dj_bt8_cgdNngDVMA8fgCx1PNBqhgrG06QKMOBEFCJsuVOZVTBX1mdm2EThvZKGTXRhIzxwM"/>
</div>
</div>
<!-- Typography -->
<div class="text-center opacity-0 animate-float-up delay-100 flex flex-col items-center">
<h1 class="font-h1 text-h1 text-white mb-sm" style="font-weight: 900;">
                EduCareLink
            </h1>
<p class="font-body text-body text-primary-fixed text-center max-w-[280px]">
                An tâm gửi gắm, trọn vẹn yêu thương
            </p>
</div>
</main>
<!-- Bottom Section (Loader) -->
<div class="flex-1 w-full flex flex-col justify-end items-center pb-xxl px-margin-mobile z-10 opacity-0 animate-float-up delay-300">
<div class="w-48 max-w-full">
<div class="loader-bar">
<div class="loader-progress"></div>
</div>
<p class="font-caption text-caption text-primary-fixed text-center mt-sm opacity-80">
                Đang tải dữ liệu...
            </p>
</div>
</div>
